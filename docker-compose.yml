services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-textlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-textlab_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-textlab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: docker-textlab:local
    restart: unless-stopped
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-textlab}:${POSTGRES_PASSWORD:-textlab_dev_password}@db:5432/${POSTGRES_DB:-textlab}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    build: .
    image: docker-textlab:local
    restart: unless-stopped
    command: ["python", "-m", "src.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-textlab}:${POSTGRES_PASSWORD:-textlab_dev_password}@db:5432/${POSTGRES_DB:-textlab}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: